name: App checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://opexa-api.onrender.com/api/v1
